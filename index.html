<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>賃貸管理・異常発見ゲーム</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{min-height:100vh}
#app{width:min(920px,100%);margin:auto;padding:6px 8px 10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.title{font-size:clamp(18px,2.6vw,27px);font-weight:900}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.badge{background:#242424;border:1px solid #444;border-radius:999px;padding:5px 10px;font-size:14px;font-weight:800}
#game{position:relative;overflow:hidden;border-radius:12px;background:#000;box-shadow:0 8px 25px rgba(0,0,0,.45);line-height:0}
#scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;cursor:crosshair}
#markers{position:absolute;inset:0;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-50%);width:5.5%;aspect-ratio:1;border:3px solid #28d66f;border-radius:50%;background:rgba(40,214,111,.10);z-index:8;animation:pop .2s ease-out}
.marker::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(16px,2vw,25px);font-weight:900;text-shadow:0 1px 3px #000}
.wrong{position:absolute;transform:translate(-50%,-50%);z-index:9;color:#ff4d4d;font-size:clamp(36px,5.5vw,64px);font-weight:900;text-shadow:0 2px 5px #000;animation:wrong .5s ease-out forwards}
#message{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:12;background:rgba(0,0,0,.84);border:1px solid #555;border-radius:999px;padding:8px 16px;font-size:clamp(14px,1.8vw,21px);font-weight:900;white-space:nowrap;opacity:0;pointer-events:none;line-height:1.3}
#message.show{animation:message .8s ease}
#side{margin-top:6px;padding:8px 10px;background:#1b1b1b;border:1px solid #333;border-radius:12px}
#side h2{margin:0 0 6px;font-size:15px}
#items{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
.item{display:flex;align-items:center;gap:7px;background:#17351f;border-radius:7px;padding:5px 8px;color:#fff;font-size:12px}
.item .pts{font-weight:900;white-space:nowrap}
#emptyMessage{color:#777;font-size:12px;padding:3px 0}
#start,#result{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.93);padding:16px}
.panel{width:min(620px,100%);background:#202020;border:1px solid #444;border-radius:18px;padding:25px;text-align:center;box-shadow:0 18px 60px #000}
.panel h1{margin:0 0 7px;font-size:clamp(28px,6vw,48px)}
.panel p{color:#ccc;line-height:1.7}
.panel strong{color:#fff}
.main{border:0;border-radius:11px;background:#fff;color:#111;padding:12px 23px;font-size:17px;font-weight:900;cursor:pointer}
.stageinfo{margin-top:9px;color:#999;font-size:13px}
.scorebig{margin:7px;font-size:clamp(44px,9vw,66px);font-weight:900}
.aptitude{font-size:clamp(24px,5vw,40px);font-weight:900;margin:10px 0}
#result{display:none}
#resultExtra{color:#ccc;line-height:1.7}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.55);opacity:.15}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes wrong{0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes message{0%{opacity:0;top:3%}18%,72%{opacity:1;top:6%}100%{opacity:0;top:6%}}
@media(max-width:600px){
  #app{padding:4px 5px 7px}
  .title{font-size:18px}
  .badge{padding:4px 8px;font-size:12px}
  #side{padding:7px 8px}
  .item{font-size:11px;padding:4px 6px}
  .marker{border-width:2px}
}
</style>
</head>

<body>

<div id="start">
  <div class="panel">
    <h1>異常発見ゲーム</h1>
    <p>あなたは賃貸管理会社の担当者。<br>物件をよく見て、<strong>「これ、管理会社的には見逃せないな」</strong>を見つけてください。</p>
    <p>正解すると<strong>クリックした場所が緑の丸で残ります。</strong><br>間違えると減点されます。</p>
    <button class="main" onclick="startGame()">GAME START</button>
    <div class="stageinfo"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="title" id="stageTitle">STAGE 1　物件外観チェック</div>
    <div class="stats">
      <div class="badge">SCORE <span id="score">0</span></div>
      <div class="badge">発見 <span id="found">0</span>/<span id="total">8</span></div>
      <div class="badge">TIME <span id="time">90</span></div>
    </div>
  </header>

  <div id="game">
    <img id="scene" alt="物件画像">
    <div id="markers"></div>
    <div id="message"></div>
  </div>

  <div id="side">
    <h2>発見した異常</h2>
    <div id="items"><div id="emptyMessage">まだありません</div></div>
  </div>
</div>

<div id="result">
  <div class="panel">
    <h1 id="resultTitle">STAGE CLEAR!</h1>
    <div class="scorebig" id="finalScore">0 点</div>
    <div id="resultExtra"></div>
    <button class="main" id="nextButton" onclick="nextStage()">STAGE 2へ</button>
  </div>
</div>

<script>
const images={
  1:"stage1.png",
  2:"stage2.png"
};

/*
  x,y = 判定中心
  w,h = 判定範囲
  すでに「約1.5倍」に広げた値。
  実際のクリックはこの範囲内なら正解。
*/

const stages={
  1:{
    title:"STAGE 1　物件外観チェック",
    time:90,
    anomalies:[
      {id:1,name:"外れてぶら下がった雨樋",pts:100,x:10.5,y:20.1,w:12,h:18},
      {id:2,name:"2階廊下・階段の手すりに干された洗濯物",pts:100,x:41.5,y:18.9,w:16.5,h:18},
      {id:3,name:"郵便受けからあふれた郵便物",pts:100,x:52,y:58,w:18,h:21},
      {id:4,name:"外のコンセントから部屋の中への盗電",pts:300,x:82,y:57.5,w:15,h:27},
      {id:5,name:"玄関まわりに勝手に置かれたプランター",pts:100,x:72,y:75,w:18,h:19},
      {id:6,name:"ゴミ置き場の分別されていないゴミ・不法投棄",pts:100,x:9.2,y:80.1,w:19.5,h:25.5},
      {id:7,name:"長期放置されたボロくて埃をかぶった自転車",pts:100,x:41.9,y:79.3,w:25.5,h:25.5},
      {id:8,name:"ペット不可なのに猫と猫の餌が置いてある",pts:200,x:60,y:85,w:18,h:19.5}
    ]
  },

  2:{
    title:"STAGE 2　退去立ち会いチェック",
    time:120,
    anomalies:[
      /* ① 中央下の壁穴 */
      {id:1,name:"壁の穴",pts:300,x:54.5,y:55.5,w:10,h:15},

      /* ② エアコン下ではなく、上中央の焦げ跡 */
      {id:2,name:"タバコによるヤニ・焦げ跡",pts:300,x:58.1,y:20.7,w:14,h:17},

      /* ③ 中央右の大きなドア破損 */
      {id:3,name:"ドアの大きな破損",pts:300,x:67.5,y:43.0,w:16,h:28},

      /* ④ エアコン下・壁のリモコンホルダー */
      {id:4,name:"エアコンのリモコン紛失",pts:300,x:23.3,y:35.2,w:12,h:17},

      /* ⑤ 中央壁の落書き */
      {id:5,name:"壁の落書き",pts:200,x:53.8,y:43.2,w:20,h:22},

      /* ⑥ 床中央左の深い傷 */
      {id:6,name:"フローリングの深い傷",pts:200,x:36.5,y:77.0,w:32,h:23},

      /* ⑦ 右側の残置物一帯 */
      {id:7,name:"残置物",pts:200,x:79.0,y:72.5,w:28,h:24},

      /* ⑧ 右壁の引っ掻き傷 */
      {id:8,name:"ペットによる引っ掻き傷",pts:200,x:95.0,y:60.0,w:10,h:25},

      /* ⑨ 右端に立てかけられた破損クローゼット扉 */
      {id:9,name:"クローゼット扉の破損",pts:200,x:86.5,y:43.5,w:18,h:32},

      /* ⑩ 左窓のガムテープ付きひび */
      {id:10,name:"窓ガラスのひび割れ（ガムテープ付き）",pts:100,x:12.0,y:28.5,w:17,h:29}
    ]
  }
};

let stage=1;
let score=0;
let found=0;
let time=90;
let timer=null;
let playing=false;

const scene=document.getElementById("scene");
const markers=document.getElementById("markers");
const message=document.getElementById("message");

function current(){
  return stages[stage];
}

const MAX_SCORE=Object.values(stages).reduce(
  (sum,s)=>sum+s.anomalies.reduce((a,b)=>a+b.pts,0),0
);

function startGame(){
  document.getElementById("start").style.display="none";
  loadStage(1);
}

function loadStage(n){
  stage=n;
  found=0;
  time=current().time;
  playing=true;

  document.getElementById("stageTitle").textContent=current().title;
  document.getElementById("found").textContent="0";
  document.getElementById("total").textContent=current().anomalies.length;
  document.getElementById("time").textContent=time;

  markers.innerHTML="";
  renderList();

  /*
    ステージ切替ごとに確実に画像を切り替える。
    Date.now() はGitHub Pagesのキャッシュ対策。
  */
  scene.src=images[stage]+"?v="+Date.now();

  clearInterval(timer);
  timer=setInterval(tick,1000);
}

function tick(){
  if(!playing)return;
  time--;
  document.getElementById("time").textContent=time;
  if(time<=0)endStage(false);
}

function renderList(){
  document.getElementById("items").innerHTML=
    '<div id="emptyMessage">まだありません</div>';
}

/*
  重要な変更点：
  透明なボタンを画像の上に置かない。
  クリックをすべて scene 側で一度だけ判定する。
  これで「間違えたのに減点されない」問題を防ぐ。
*/
scene.addEventListener("click",function(e){

  if(!playing)return;

  const r=scene.getBoundingClientRect();

  const x=(e.clientX-r.left)/r.width*100;
  const y=(e.clientY-r.top)/r.height*100;

  /*
    クリック位置がどの異常の判定範囲に入っているか探す。
    複数に重なった場合は中心に一番近いものを採用。
  */
  const candidates=current().anomalies.filter(a=>{
    const halfW=a.w/2;
    const halfH=a.h/2;
    return (
      x>=a.x-halfW &&
      x<=a.x+halfW &&
      y>=a.y-halfH &&
      y<=a.y+halfH
    );
  });

  let hit=null;

  if(candidates.length){
    candidates.sort((a,b)=>{
      const da=Math.pow(x-a.x,2)+Math.pow(y-a.y,2);
      const db=Math.pow(x-b.x,2)+Math.pow(y-b.y,2);
      return da-db;
    });
    hit=candidates[0];
  }

  /* すでに発見済み */
  if(hit && hit.found){
    addMarker(e.clientX-r.left,e.clientY-r.top,true);
    showMessage("発見済みです");
    return;
  }

  /* 正解 */
  if(hit){

    hit.found=true;
    score+=hit.pts;
    found++;

    document.getElementById("score").textContent=score;
    document.getElementById("found").textContent=found;

    addMarker(
      e.clientX-r.left,
      e.clientY-r.top,
      true
    );

    addAnswer(hit);

    showMessage("発見！  +"+hit.pts+"点");

    if(found===current().anomalies.length){
      setTimeout(()=>endStage(true),500);
    }

    return;
  }

  /* 不正解 */
  score-=5;

  document.getElementById("score").textContent=score;

  addMarker(
    e.clientX-r.left,
    e.clientY-r.top,
    false
  );

  showMessage("そこじゃない！  −5点");
});

function addAnswer(a){

  const empty=document.getElementById("emptyMessage");

  if(empty)empty.remove();

  const item=document.createElement("div");

  item.className="item";

  item.innerHTML=
    `<span>✓ ${a.name}</span>
     <span class="pts">+${a.pts}</span>`;

  document.getElementById("items").appendChild(item);
}

function addMarker(px,py,correct){

  const r=scene.getBoundingClientRect();
  const m=document.createElement("div");

  m.style.left=(px/r.width*100)+"%";
  m.style.top=(py/r.height*100)+"%";

  if(correct){
    m.className="marker";
    markers.appendChild(m);
  }else{
    m.className="wrong";
    m.textContent="×";
    markers.appendChild(m);
    setTimeout(()=>m.remove(),500);
  }
}

function showMessage(text){
  message.textContent=text;
  message.classList.remove("show");
  void message.offsetWidth;
  message.classList.add("show");
}

function aptitudeComment(){
  const max=MAX_SCORE;
  const ratio=score/max;

  if(ratio>=0.90)
    return "かなり向いてます。物件を見た瞬間に「なんか怪しい」が働くタイプ。管理会社では頼りにされる人です。";

  if(ratio>=0.75)
    return "なかなかの管理会社適性。異常にも気づくし、ちゃんと疑う。入居者さんの言い訳にも負けなさそうです。";

  if(ratio>=0.60)
    return "管理人見習いとしては優秀。あと一歩の慎重さがあれば、退去立ち会いで強そうです。";

  if(ratio>=0.40)
    return "悪くない。でも物件はもう少し疑って見たほうがいいかも。「たぶん大丈夫」は賃貸管理ではだいたい危険です。";

  return "まだまだ修行中。賃貸管理の世界では、玄関を開けた瞬間から何か起きていると思ったほうがいいです。";
}

function endStage(clear){

  if(!playing)return;

  playing=false;
  clearInterval(timer);

  document.getElementById("result").style.display="flex";

  const btn=document.getElementById("nextButton");
  const extra=document.getElementById("resultExtra");

  if(stage===1 && clear){

    document.getElementById("resultTitle").textContent="STAGE 1 CLEAR!";
    document.getElementById("finalScore").textContent=score+" 点";

    extra.innerHTML=
      "すべての異常を発見しました。<br>次は退去立ち会いです。";

    btn.style.display="inline-block";
    btn.textContent="STAGE 2へ";
    btn.onclick=nextStage;

  }else if(stage===2){

    document.getElementById("resultTitle").textContent=
      clear ? "GAME CLEAR!" : "GAME END";

    document.getElementById("finalScore").textContent=
      score+" 点";

    extra.innerHTML=
      `<div class="aptitude">あなたの賃貸管理人適性</div>
       <div>${aptitudeComment()}</div>`;

    btn.style.display="inline-block";
    btn.textContent="もう一度プレイ";
    btn.onclick=()=>location.reload();

  }else{

    document.getElementById("resultTitle").textContent="TIME UP";
    document.getElementById("finalScore").textContent=score+" 点";

    extra.innerHTML=
      "時間切れ。"+found+" / "+
      current().anomalies.length+
      "件を発見しました。";

    btn.style.display="inline-block";
    btn.textContent="もう一度プレイ";
    btn.onclick=()=>location.reload();
  }
}

function nextStage(){
  document.getElementById("result").style.display="none";
  loadStage(2);
}
</script>

</body>
</html>
